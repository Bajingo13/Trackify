name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: trackify-ci-password
      DB_NAME: trackify_ci
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: trackify-ci-password
          MYSQL_DATABASE: trackify_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix frontend
          npm ci --prefix backend
      - name: Apply test database migrations
        run: npm run db:migrate
      - name: Backend tests
        run: npm --prefix backend test
      - name: Frontend production build
        run: npm run build

  # The API end-to-end suites. These need a running server and the seeded demo
  # data, not just a migrated schema, so they cannot join the `verify` job.
  #
  # They pass locally against a seeded database. They have never run on a
  # freshly migrated CI database, where a suite may find its precondition
  # missing (no in-transit trip, say) and exit 2 rather than pass — so this
  # job is advisory for now. Drop `continue-on-error` once a run comes back
  # green and let it gate merges properly.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: trackify-ci-password
      DB_NAME: trackify_ci
      JWT_SECRET: trackify-ci-jwt-secret-not-used-anywhere-else
      # seedAdmin.js requires the email as well — it has a default username but
      # not a default address, and exits 1 when either is missing.
      SEED_ADMIN_EMAIL: admin@astreablue.com
      SEED_ADMIN_PASSWORD: Trackify!CI2026
      SEED_DEMO_PASSWORD: demo123
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: trackify-ci-password
          MYSQL_DATABASE: trackify_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install backend dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend
      - name: Apply migrations and seed demo data
        run: |
          npm run db:migrate
          npm run db:seed-admin
          npm run db:seed-demo
      - name: Start the API
        run: |
          npm --prefix backend start &
          echo "api_pid=$!" >> "$GITHUB_ENV"
      - name: End-to-end suites
        run: npm run test:e2e
      - name: Stop the API
        if: always()
        run: kill "${api_pid}" 2>/dev/null || true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout can pad around a notch; the app is
         portrait-only and must not be zoomable, which on a phone turns an
         accidental pinch into an unusable screen mid-delivery. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Trackify Driver</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/driver-main.jsx"></script>
  </body>
</html>
